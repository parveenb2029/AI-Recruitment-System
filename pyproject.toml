[project]
name = "recruit"
version = "0.1.0"
description = "AI-assisted recruitment pipeline with evidence-cited, human-gated screening"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# OCR needs system binaries too: Tesseract and Poppler. See README.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
recruit-ingest = "recruit.ingest:main"
recruit-extract = "recruit.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
