[project]
name = "recruit"
version = "0.1.0"
description = "AI-assisted recruitment pipeline with evidence-cited, human-gated screening"
requires-python = ">=3.11"
license = { text = "MIT" }

# Everything src/recruit imports at module level must be listed here, or a fresh
# install fails at first run. tests/test_packaging.py enforces that.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    # Imported directly by validate.py and tools/validate_output.py to build the
    # schema registry. It arrives as a jsonschema transitive today, but relying
    # on that would break the day jsonschema swaps it out.
    "referencing>=0.30",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Postgres driver. Not in core dependencies because SQLite covers development
# and the whole test suite; a laptop should not need to compile a driver.
postgres = ["psycopg[binary]>=3.1"]
# OCR also needs system binaries — Tesseract and Poppler. See README.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
anthropic = ["anthropic>=0.40"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Starlette's TestClient moved from httpx to httpx2 in 1.2 (May 2026) and a
    # current Starlette raises on import without it. Both are declared: httpx2
    # for current Starlette, httpx so an older pinned one still has a client.
    # Found by running the suite on a machine with newer libraries than the one
    # the code was written on — which is the entire argument for hard rule 6.
    "httpx2>=2.0",
    "httpx>=0.27",
]
# Everything, for a full local install.
all = [
    "recruit[postgres]",
    "recruit[ocr]",
    "recruit[anthropic]",
    "recruit[web]",
    "recruit[dev]",
]

[project.scripts]
recruit-ingest = "recruit.ingest:main"
recruit-extract = "recruit.extract:main"
recruit-match = "recruit.match:main"
recruit-bias-audit = "recruit.bias_audit:main"
recruit-users = "recruit.users:main"
recruit-db-init = "recruit.db_init:main"
recruit-bootstrap = "recruit.bootstrap:main"
recruit-seed = "recruit.seed:main"
recruit-web = "recruit.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src", "tools", "tests"]
# The retired document generators are preserved byte-identical and
# checksum-verified — that is the whole point of keeping them. Linting them
# would leave `ruff check .` permanently red, or tempt someone into edits that
# break the guarantee they exist to provide. They are never imported and never
# run (hard rule 1).
exclude = ["tools/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is how FastAPI declares dependencies.
"src/recruit/web/app.py" = ["B008"]
