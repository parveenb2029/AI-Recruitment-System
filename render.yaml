# One-click deploy: your own copy, on your own server, with your own accounts.
#
# Render reads this file when you click "Deploy to Render" in the README, or
# when you point a new Blueprint at your fork. It creates two things: a Postgres
# database and a web service running this repository's Dockerfile, wired
# together. Nothing is shared with anyone else's copy — the database is yours,
# the candidates in it are yours, and nobody but the accounts you create can
# sign in.
#
# WHAT IT WILL ASK YOU FOR
#
#   Administrator email   The first account. You sign in as this.
#   Anthropic API key     Optional. Leave it blank to try the system with the
#                         fake model on the sample resumes; add it later, in the
#                         dashboard, when you want to process a real one.
#
# The administrator PASSWORD is not asked for and is not set here — you choose
# it in the browser on your first visit.
#
#   1. When the deploy finishes, open your service's URL with /setup on the end
#      and the setup token after it:   https://YOUR-APP.onrender.com/setup?token=...
#   2. The token is in the Render dashboard under Environment, as
#      RECRUIT_SETUP_TOKEN. Render generates it; nobody chose it and it is in no
#      file, so it cannot be committed to a public repository.
#   3. Enter your email and pick a password. That screen then disappears for
#      good — it can only ever be used once.
#
# Why a token at all, when a laptop install needs none: between this service
# starting and you first opening it, whoever reaches /setup first becomes its
# administrator, and on a public URL that is everyone. The dashboard is the one
# channel a stranger with your URL does not have, so the secret travels through
# it. If you would rather not, delete RECRUIT_SETUP_TOKEN and use
# `python -m recruit.bootstrap` from a shell instead — the setup page then does
# not exist at all.
#
# WHAT IT COSTS
#
# The free plans are enough to try it, with one trap worth knowing before you
# click: Render's FREE POSTGRES DELETES ITSELF 30 DAYS after creation. Free web
# services also sleep when idle, so the first request after a quiet spell is
# slow — that part is only an annoyance.
#
# If you want this copy to still hold its data in three months, put the database
# somewhere without a timer. The README's "Free plans, and the trap in them"
# section walks through pointing DATABASE_URL at a free Neon database instead;
# the scheme it gives you works here unchanged.
#
# For anything with real work in it, change `plan: free` to `starter` on both.
#
# BEFORE YOU PUT REAL CANDIDATES IN IT
#
# Read the "Before you use this on real candidates" section of the README. In
# short: no accuracy figure has been measured, no DPIA has been performed, and
# the bias harness is not an independent LL144 audit.

databases:
  - name: recruit-db
    databaseName: recruit
    user: recruit
    plan: free

services:
  - type: web
    name: recruit-console
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Wired automatically from the database above — you never see or paste
      # it. Render hands out a bare `postgresql://` URL, which SQLAlchemy reads
      # as "use psycopg2"; this image ships psycopg 3, so `db.session`
      # normalises the scheme rather than making you edit a generated URL.
      - key: DATABASE_URL
        fromDatabase:
          name: recruit-db
          property: connectionString

      # This is the setting that makes a hosted copy safe. The shipped config
      # file says `single_user`, which means no sign-in screen at all — correct
      # on a laptop, a disclosure of every applicant on a public URL. The app
      # refuses to start without this on a platform it can tell is public.
      - key: RECRUIT_AUTH_PROVIDER
        value: local

      # Render terminates TLS, so the browser is always on HTTPS.
      - key: RECRUIT_SECURE_COOKIE
        value: "1"

      # Asked for once, when the Blueprint is first created. Render does not
      # ask again on later deploys; change it in the dashboard.
      - key: RECRUIT_ADMIN_EMAIL
        sync: false

      # Render generates this and shows it under Environment. It is what lets
      # you, and only you, open /setup and claim the first account. Nothing
      # secret is written into this public repository, and you are not asked to
      # invent a password in a web form before the thing has even deployed.
      - key: RECRUIT_SETUP_TOKEN
        generateValue: true

      # Optional, and deliberately not in any file. The repository is public;
      # a key committed to it is a key to rotate. Paste it into the dashboard —
      # Render stores it encrypted and never shows it in a build log.
      - key: ANTHROPIC_API_KEY
        sync: false

      # The sample queue, so the first screen is not empty. Set this to 0 in
      # the dashboard once you have real work in it.
      - key: RECRUIT_SEED
        value: "1"

      # Render sets RENDER=true itself, so the safety check would fire anyway.
      # Stated explicitly so the reason is readable here rather than inferred.
      - key: RECRUIT_PUBLIC
        value: "1"
