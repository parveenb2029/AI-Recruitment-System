{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block head %}
<style>
.card{max-width:380px;margin:8vh auto;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:26px}
.card h2{margin:0 0 4px;font-size:1.15rem;letter-spacing:-.01em}
.card p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface);color:var(--ink);margin-bottom:14px}
.err{background:var(--crit-soft);color:var(--crit);border-radius:3px;padding:9px 11px;font-size:13px;margin-bottom:16px}
button[type=submit]{width:100%;background:var(--accent);border-color:var(--accent);color:#fff;padding:9px}
</style>
{% endblock %}
{% block content %}
<div class="card">
  <h2>Sign in</h2>
  <p class="sub">Every review decision is recorded against your account.</p>
  {% if error %}<div class="err">Email or password not recognised.</div>{% endif %}
  <form method="post" action="/login">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
